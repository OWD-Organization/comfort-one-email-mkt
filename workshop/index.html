<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OWD workflow foundation — discussion deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0b1f3a;
      --navy-2: #16345c;
      --teal: #1a9b8e;
      --teal-d: #12756b;
      --cream: #f6f1e6;
      --paper: #fffdf8;
      --coral: #d4684a;
      --ink: #1c2430;
      --muted: #5b6573;
      --line: #d9d0c0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--navy);
      color: var(--ink);
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
    }
    .deck { height: 100%; display: flex; flex-direction: column; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.55rem 1.1rem; color: #e8eef6; font-size: 0.82rem; gap: 1rem;
    }
    .topbar strong { color: #fff; letter-spacing: 0.04em; }
    .badge {
      background: var(--coral); color: #fff; font-weight: 700; font-size: 0.72rem;
      padding: 0.2rem 0.55rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .progress { flex: 1; height: 4px; background: #2a4568; border-radius: 99px; overflow: hidden; max-width: 280px; }
    .progress > span { display: block; height: 100%; background: var(--teal); width: 0%; }
    .stage { flex: 1; display: grid; place-items: center; padding: 0.4rem 0.8rem 0.2rem; }
    .slide {
      display: none;
      width: min(1120px, 96vw);
      height: min(680px, calc(100vh - 96px));
      background: var(--cream);
      border-radius: 18px;
      padding: 2rem 2.4rem;
      overflow: auto;
      box-shadow: 0 24px 60px rgba(0,0,0,.28);
    }
    .slide.on { display: block; }
    h1, h2, h3 { font-family: Fraunces, Georgia, serif; margin: 0 0 0.6rem; color: var(--navy); }
    h1 { font-size: clamp(2rem, 4vw, 3.1rem); line-height: 1.15; }
    h2 { font-size: clamp(1.55rem, 3vw, 2.15rem); }
    .lede { font-size: 1.2rem; color: var(--muted); max-width: 42rem; }
    .kicker { color: var(--teal-d); font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.78rem; margin-bottom: 0.45rem; }
    .grid { display: grid; gap: 0.85rem; }
    .g2 { grid-template-columns: 1fr 1fr; }
    .g3 { grid-template-columns: 1fr 1fr 1fr; }
    .g5 { grid-template-columns: repeat(5, 1fr); }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem 1.1rem;
    }
    .card h3 { font-size: 1.05rem; margin-bottom: 0.35rem; }
    .card p, li { color: var(--ink); }
    .card.teal { border-top: 4px solid var(--teal); }
    .card.navy { border-top: 4px solid var(--navy); }
    .card.coral { border-top: 4px solid var(--coral); }
    ul { margin: 0.3rem 0 0; padding-left: 1.1rem; }
    li { margin: 0.28rem 0; }
    .hero-img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
    .caption { font-size: 0.92rem; color: var(--muted); margin-top: 0.55rem; }
    .nav {
      display: flex; align-items: center; justify-content: center; gap: 0.7rem;
      padding: 0.45rem 1rem 0.7rem; color: #c5d0de;
    }
    .nav button {
      background: var(--navy-2); color: #fff; border: 0; border-radius: 8px;
      padding: 0.45rem 0.85rem; cursor: pointer; font: inherit; font-weight: 600;
    }
    .nav button:hover { background: var(--teal-d); }
    .hint { font-size: 0.78rem; opacity: 0.8; }
    table { width: 100%; border-collapse: collapse; background: var(--paper); border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 0.7rem 0.85rem; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 0.98rem; }
    th { background: var(--navy); color: #fff; font-weight: 600; }
    .who { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--teal-d); }
    .q { background: #fff; border-left: 4px solid var(--teal); padding: 0.75rem 1rem; border-radius: 0 12px 12px 0; margin: 0.45rem 0; }
    .split-pro, .split-con { padding: 0.9rem 1rem; border-radius: 12px; }
    .split-pro { background: #e7f5f2; }
    .split-con { background: #fdece7; }
    .tag { display: inline-block; background: var(--navy); color: #fff; border-radius: 999px; padding: 0.12rem 0.55rem; font-size: 0.75rem; margin: 0.12rem; }
    .tag.off { background: #cfc6b6; color: var(--navy); }
    footer.note { margin-top: 0.8rem; font-size: 0.88rem; color: var(--muted); }
    .center { text-align: center; }
    .big { font-size: 1.35rem; }
    svg.diagram { width: 100%; height: auto; }
    @media (max-width: 900px) {
      .g2, .g3, .g5 { grid-template-columns: 1fr; }
      .slide { height: auto; min-height: 70vh; padding: 1.2rem; }
    }
    @media print {
      .topbar, .nav { display: none; }
      .stage { display: block; padding: 0; }
      .slide { display: block !important; width: auto; height: auto; box-shadow: none; page-break-after: always; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="deck">
    <div class="topbar">
      <div><strong>OWD</strong> · Workflow foundation · Team workshop</div>
      <div class="badge">Not a vote — a map</div>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <div id="counter">1 / 1</div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="nav">
      <button type="button" id="prev">← Back</button>
      <span class="hint">Arrows · Space · P = print / PDF</span>
      <button type="button" id="next">Next →</button>
    </div>
  </div>

  <template id="slides">
    <section class="slide" data-title="Title">
      <p class="kicker">Outworkem Digital · Internal workshop</p>
      <h1>How we organize client work, files, and agents</h1>
      <p class="lede">A shared foundation for technical and non-technical teammates. Today we learn the map. We do <strong>not</strong> pick a final setup in this first pass.</p>
      <div class="grid g3" style="margin-top:1.4rem">
        <div class="card teal"><div class="who">Goal today</div><h3>Same picture</h3><p>Everyone can point to Drive, GitHub, ClickUp, Slack, and Cursor and say what each is for.</p></div>
        <div class="card navy"><div class="who">Not today</div><h3>No lock-in</h3><p>No “we decided Option A.” No new client machines or automations unless the room agrees it is obviously safe.</p></div>
        <div class="card coral"><div class="who">After</div><h3>A second meeting</h3><p>Sleep on it. Collect questions. Then choose. This is the operating system of the agency.</p></div>
      </div>
    </section>

    <section class="slide" data-title="How to use this">
      <p class="kicker">Facilitation</p>
      <h2>How to use this deck together</h2>
      <div class="grid g2">
        <div class="card">
          <h3>For everyone</h3>
          <ul>
            <li>If a word is unclear, stop the presenter. Jargon is a bug.</li>
            <li>Write questions on a shared doc; do not debate every slide.</li>
            <li>Green-flag / red-flag reactions are welcome. Decisions wait.</li>
          </ul>
        </div>
        <div class="card">
          <h3>Two languages on each idea</h3>
          <ul>
            <li><strong>Floor:</strong> what an account manager or specialist does on Monday.</li>
            <li><strong>Basement:</strong> what GitHub, secrets, and automations are doing underneath.</li>
          </ul>
        </div>
      </div>
      <p class="caption">Keyboard: ← → or Space. Print this file to PDF if people want to annotate.</p>
    </section>

    <section class="slide" data-title="Why">
      <p class="kicker">The problem</p>
      <h2>We are building the factory, not one more campaign</h2>
      <div class="grid g2">
        <div class="card teal">
          <h3>If we improvise per client</h3>
          <ul>
            <li>Brand files live in five places.</li>
            <li>Each person invents a slightly different process.</li>
            <li>Agents (and humans) mix client context by accident.</li>
            <li>Onboarding a new retainer takes tribal knowledge.</li>
          </ul>
        </div>
        <div class="card navy">
          <h3>If we share one map</h3>
          <ul>
            <li>You always know where Comfort One’s GBP photos live.</li>
            <li>SEO craft improves once, then every client benefits.</li>
            <li>Logins never sit in a shared “god agent.”</li>
            <li>Selling a new service means adding a folder + a list — not a new universe.</li>
          </ul>
        </div>
      </div>
      <p class="footer note">This is slower than “just start.” That is the point.</p>
    </section>

    <section class="slide" data-title="Services">
      <p class="kicker">What we sell</p>
      <h2>Five services. Clients buy a mix.</h2>
      <div class="grid g5">
        <div class="card teal"><h3>Website</h3><p>Build and change the site.</p></div>
        <div class="card teal"><h3>SEO</h3><p>Search visibility beyond the map pack.</p></div>
        <div class="card teal"><h3>Local SEO</h3><p>City / service-area search.</p></div>
        <div class="card teal"><h3>GBP</h3><p>Google Business Profile.</p></div>
        <div class="card teal"><h3>Paid ads</h3><p>Paid media briefs, QA, reporting.</p></div>
      </div>
      <p class="lede" style="margin-top:1rem">Email or other channels later use the <em>same pattern</em> — they do not need a special snowflake system.</p>
    </section>

    <section class="slide" data-title="Mix">
      <p class="kicker">Retainers are not identical</p>
      <h2>Same menu, different plates</h2>
      <img class="hero-img" src="images/infographic-client-mix.png" alt="Three clients buying different mixes of services" />
      <p class="caption">Rule to discuss: do not create empty ClickUp lists or Drive folders for work they did not buy. Add them when they buy the service.</p>
    </section>

    <section class="slide" data-title="Five systems">
      <p class="kicker">The ecosystem</p>
      <h2>Five systems. None of them is “the agent.”</h2>
      <img class="hero-img" src="images/infographic-five-systems.png" alt="Five systems: Drive, GitHub, ClickUp, Slack, Cursor" />
    </section>

    <section class="slide" data-title="What lives where">
      <p class="kicker">Put this on the wall</p>
      <h2>What lives where</h2>
      <table>
        <thead>
          <tr><th>System</th><th>In one sentence</th><th>Examples</th><th>Who lives here daily</th></tr>
        </thead>
        <tbody>
          <tr><td><strong>Google Drive</strong></td><td>The client file cabinet</td><td>Brand kit, creatives, GBP photos, reports, SOW</td><td>Everyone</td></tr>
          <tr><td><strong>GitHub</strong></td><td>Versioned work with history</td><td>Website code, agency playbooks / skills</td><td>Web + whoever maintains playbooks</td></tr>
          <tr><td><strong>ClickUp</strong></td><td>The work queue</td><td>Tasks by purchased service</td><td>AMs + specialists</td></tr>
          <tr><td><strong>Slack</strong></td><td>Conversation</td><td>#client-name, internal ops thread</td><td>Everyone, including the client</td></tr>
          <tr><td><strong>Cursor</strong></td><td>Helpers that follow our map</td><td>Draft a GBP post, open a site PR, weekly SEO checklist</td><td>Kicked off by people or schedules</td></tr>
        </tbody>
      </table>
      <p class="caption"><strong>Drive is not GitHub.</strong> Folders do not have branches or pull requests. Agents work better on git for code; Drive is where humans already store files.</p>
    </section>

    <section class="slide" data-title="Drive tree">
      <p class="kicker">Google Drive — both options use this</p>
      <h2>One cabinet per client</h2>
      <div class="grid g2">
        <div class="card">
          <pre style="margin:0;font-size:0.95rem;line-height:1.45">OWD /
  _Agency / Playbooks, Templates
  Clients /
    Comfort-One /
      00-Account
      Website      ← only if sold
      SEO
      Local-SEO
      GBP
      Paid-Ads
      Reports</pre>
        </div>
        <div class="card navy">
          <h3>Discussion prompts</h3>
          <ul>
            <li>Is 00-Account enough for brand voice, or do we also want a one-page “how to talk like this client”?</li>
            <li>Who is allowed to create a new client folder? AM? Ops?</li>
            <li>Passwords never live in Drive as a spreadsheet. Where do they live instead? (We’ll name the tool later.)</li>
          </ul>
        </div>
      </div>
    </section>

    <section class="slide" data-title="Three layers">
      <p class="kicker">Cursor in plain English</p>
      <h2>We do not hire a robot per client</h2>
      <img class="hero-img" src="images/infographic-three-layers.png" alt="Three layers: craft, client, trigger" />
      <div class="grid g3" style="margin-top:0.8rem">
        <div class="card"><h3>Craft = skill</h3><p>How OWD does SEO, ads, GBP, websites. Improves once for the whole agency.</p></div>
        <div class="card"><h3>Client = folder + logins</h3><p>Their brand, Drive, and secrets. Isolation lives here.</p></div>
        <div class="card"><h3>Trigger = automation</h3><p>Weekly schedule, Slack emoji, or ClickUp task. Cloned per client, only for services they bought.</p></div>
      </div>
    </section>

    <section class="slide" data-title="Monday flow">
      <p class="kicker">A Monday, not a diagram in the abstract</p>
      <h2>Example: “Need two GBP posts this week”</h2>
      <svg class="diagram" viewBox="0 0 1040 220" role="img" aria-label="Flow from Slack to draft to ClickUp">
        <defs>
          <style>
            .bx { fill: #fffdf8; stroke: #16345c; stroke-width: 2; }
            .t { font-family: Source Sans 3, sans-serif; fill: #0b1f3a; }
            .s { font-size: 15px; font-weight: 700; }
            .p { font-size: 13px; fill: #5b6573; }
            .a { fill: #1a9b8e; }
          </style>
        </defs>
        <rect class="bx" x="8" y="40" width="180" height="120" rx="12"/>
        <text class="t s" x="24" y="78">1. Slack</text>
        <text class="t p" x="24" y="104">Client channel</text>
        <text class="t p" x="24" y="124">or internal note</text>
        <polygon class="a" points="200,100 228,88 228,112"/>
        <rect class="bx" x="236" y="40" width="180" height="120" rx="12"/>
        <text class="t s" x="252" y="78">2. ClickUp</text>
        <text class="t p" x="252" y="104">Task on GBP list</text>
        <text class="t p" x="252" y="124">(list exists = sold)</text>
        <polygon class="a" points="428,100 456,88 456,112"/>
        <rect class="bx" x="464" y="40" width="200" height="120" rx="12"/>
        <text class="t s" x="480" y="78">3. Cursor helper</text>
        <text class="t p" x="480" y="104">Uses GBP skill</text>
        <text class="t p" x="480" y="124">Reads that Drive folder</text>
        <polygon class="a" points="676,100 704,88 704,112"/>
        <rect class="bx" x="712" y="40" width="150" height="120" rx="12"/>
        <text class="t s" x="728" y="78">4. Draft</text>
        <text class="t p" x="728" y="104">Internal thread</text>
        <text class="t p" x="728" y="124">not auto-sent</text>
        <polygon class="a" points="874,100 902,88 902,112"/>
        <rect class="bx" x="910" y="40" width="120" height="120" rx="12"/>
        <text class="t s" x="926" y="78">5. Human</text>
        <text class="t p" x="926" y="104">Approve, post,</text>
        <text class="t p" x="926" y="124">close task</text>
      </svg>
      <p class="caption">Discuss: should Slack ever kick the helper off without a ClickUp task? Default suggestion for debate: <strong>ClickUp is the queue; Slack is talk.</strong></p>
    </section>

    <section class="slide" data-title="Option A visual">
      <p class="kicker">Option A</p>
      <h2>Client hub — one place per account</h2>
      <img class="hero-img" src="images/infographic-option-a.png" alt="Option A: one client folder with service subfolders" />
    </section>

    <section class="slide" data-title="Option A detail">
      <p class="kicker">Option A · Floor and basement</p>
      <h2>What Option A actually is</h2>
      <div class="grid g2">
        <div class="card teal">
          <div class="who">Floor — everyone</div>
          <ul>
            <li>Open the client’s Drive folder. See only sold services.</li>
            <li>ClickUp Space = that client. Lists = sold services.</li>
            <li>Slack channel = that client.</li>
            <li>Website (if we own it) has a GitHub repo. If we don’t, there is no site repo.</li>
          </ul>
        </div>
        <div class="card navy">
          <div class="who">Basement — technical</div>
          <ul>
            <li>One GitHub repo <code>owd-playbooks</code> for shared skills.</li>
            <li>Optional <code>web-{client}</code> for the site.</li>
            <li>Cursor automations cloned per client, enabled only for sold services.</li>
            <li>Secrets (ads, GBP, CMS) scoped to that client — never a shared bag.</li>
          </ul>
        </div>
      </div>
    </section>

    <section class="slide" data-title="Option A tradeoffs">
      <p class="kicker">Option A</p>
      <h2>Pros and cons to argue about</h2>
      <div class="grid g2">
        <div class="split-pro">
          <h3>Pros</h3>
          <ul>
            <li>Matches how AMs and Slack already think.</li>
            <li>Partial retainers are obvious.</li>
            <li>Harder to mix client files and logins.</li>
            <li>GitHub stays small: playbooks + real websites.</li>
            <li>Non-technical people almost never need GitHub.</li>
          </ul>
        </div>
        <div class="split-con">
          <h3>Cons</h3>
          <ul>
            <li>SEO / ads / GBP files live in Drive; agents are clumsier there than in git.</li>
            <li>Specialists hop between many client folders.</li>
            <li>We still copy automations per client (Cursor works that way).</li>
            <li>Website-less clients have no GitHub home — easy to forget how those helpers start.</li>
          </ul>
        </div>
      </div>
      <p class="footer note">Leaning note (not a decision): this is the simpler cultural fit if OWD is account-led.</p>
    </section>

    <section class="slide" data-title="Option B visual">
      <p class="kicker">Option B</p>
      <h2>Service lines — specialists own the craft</h2>
      <img class="hero-img" src="images/infographic-option-b.png" alt="Option B: playbook repos feeding multiple clients" />
      <p class="caption">Drive still has a folder per client. GitHub is organized by discipline (SEO playbook, ads playbook, …).</p>
    </section>

    <section class="slide" data-title="Option B detail">
      <p class="kicker">Option B · Floor and basement</p>
      <h2>What Option B actually is</h2>
      <div class="grid g2">
        <div class="card teal">
          <div class="who">Floor — everyone</div>
          <ul>
            <li>Same Drive cabinet and ClickUp Space per client.</li>
            <li>SEO people “live” in the SEO playbook; ads people in ads.</li>
            <li>AMs still open the client, not the playbook, for status.</li>
          </ul>
        </div>
        <div class="card navy">
          <div class="who">Basement — technical</div>
          <ul>
            <li>Repos: <code>playbooks-seo</code>, <code>playbooks-ads</code>, <code>playbooks-gbp</code>, … plus <code>web-{client}</code>.</li>
            <li>A helper starts in the playbook repo, then reads that client’s Drive / task.</li>
            <li><strong>Must</strong> load only that client’s logins. A shared ads environment with every client’s keys is a fail.</li>
          </ul>
        </div>
      </div>
    </section>

    <section class="slide" data-title="Option B tradeoffs">
      <p class="kicker">Option B</p>
      <h2>Pros and cons to argue about</h2>
      <div class="grid g2">
        <div class="split-pro">
          <h3>Pros</h3>
          <ul>
            <li>Craft compounds: one SEO SOP upgrade helps every client.</li>
            <li>Clear ownership for service leads.</li>
            <li>Helpers boot with the right checklist and tools.</li>
            <li>Fits a department org (SEO team vs ads team).</li>
          </ul>
        </div>
        <div class="split-con">
          <h3>Cons</h3>
          <ul>
            <li>Two maps: Drive by client, GitHub by service. Things will be filed wrong.</li>
            <li>Secret isolation is easier to get wrong than in Option A.</li>
            <li>Heavier than we need if one pod does all five services.</li>
            <li>AMs do not have “one GitHub repo” for the account (they shouldn’t need it).</li>
          </ul>
        </div>
      </div>
      <p class="footer note">Leaning note (not a decision): worth it when service leads will actually maintain playbook repos.</p>
    </section>

    <section class="slide" data-title="Compare">
      <p class="kicker">Side by side</p>
      <h2>Same client cabinet. Different GitHub gravity.</h2>
      <table>
        <thead>
          <tr><th></th><th>Option A — Client hub</th><th>Option B — Service lines</th></tr>
        </thead>
        <tbody>
          <tr><td><strong>Drive</strong></td><td>Per client</td><td>Per client (same)</td></tr>
          <tr><td><strong>ClickUp / Slack</strong></td><td>Per client</td><td>Per client (same)</td></tr>
          <tr><td><strong>GitHub</strong></td><td>Playbooks + sites only</td><td>One playbook repo per service + sites</td></tr>
          <tr><td><strong>Where specialists feel at home</strong></td><td>Inside the client folder</td><td>Inside their playbook repo</td></tr>
          <tr><td><strong>Biggest risk</strong></td><td>Agents weak on Drive-only work</td><td>Mixing client logins on a shared helper</td></tr>
          <tr><td><strong>Fits</strong></td><td>Account-led, mixed retainers</td><td>Specialist teams, productized services</td></tr>
        </tbody>
      </table>
    </section>

    <section class="slide" data-title="Partial">
      <p class="kicker">Stress test</p>
      <h2>Client buys only Local SEO + GBP</h2>
      <div class="grid g2">
        <div class="card">
          <p><span class="tag">Local SEO</span><span class="tag">GBP</span>
            <span class="tag off">Website</span><span class="tag off">SEO</span><span class="tag off">Ads</span></p>
          <ul>
            <li>Drive: 00-Account, Local-SEO, GBP, Reports. No Website / Ads folders.</li>
            <li>ClickUp: two lists only.</li>
            <li>Slack: still one client channel.</li>
            <li>GitHub: <strong>no</strong> <code>web-*</code> repo.</li>
            <li>Cursor: two cadence helpers, not five.</li>
          </ul>
        </div>
        <div class="card navy">
          <h3>When they later buy ads</h3>
          <ul>
            <li>Add Drive folder Paid-Ads.</li>
            <li>Add ClickUp list.</li>
            <li>Clone the ads automation.</li>
            <li>Add ads logins to <em>that client only</em>.</li>

  <script>
    const stage = document.getElementById("stage");
    const slides = [...document.getElementById("slides").content.querySelectorAll(".slide")];
    slides.forEach((s) => stage.appendChild(s));
    let i = 0;
    const bar = document.getElementById("bar");
    const counter = document.getElementById("counter");
    function show(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach((s, idx) => s.classList.toggle("on", idx === i));
      bar.style.width = ((i + 1) / slides.length * 100) + "%";
      counter.textContent = (i + 1) + " / " + slides.length;
    }
    document.getElementById("prev").onclick = () => show(i - 1);
    document.getElementById("next").onclick = () => show(i + 1);
    document.addEventListener("keydown", (e) => {
      if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(i + 1); }
      if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(i - 1); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(slides.length - 1);
      if (e.key === "p" || e.key === "P") window.print();
    });
    show(0);
  </script>
